<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ — Hoàng Thế Long</title>
    <meta name="description" content="Liên hệ với Hoàng Thế Long qua email, Zalo hoặc form nhắn tin.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-transition">

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <a class="nav-logo" href="index.html">HTL</a>
            <nav class="nav-links">
                <a class="nav-link" href="index.html">Trang chủ</a>
                <a class="nav-link" href="about.html">Về tôi</a>
                <a class="nav-link" href="education.html">Học vấn</a>
                <a class="nav-link" href="skills.html">Kỹ năng</a>
                <a class="nav-link" href="experience.html">Kinh nghiệm</a>
                <a class="nav-link active" href="contact.html">Liên hệ</a>
            </nav>
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="section container" id="contact" style="padding-top: 8rem;">
            <div class="section-header animate-on-scroll">
                <h2 class="section-title">Liên Hệ</h2>
                <p class="section-subtitle">Hãy kết nối với tôi — tôi luôn sẵn sàng trao đổi</p>
            </div>

            <div class="contact-layout">
                <!-- Contact Info -->
                <div class="contact-info-list animate-on-scroll">
                    <div class="contact-card">
                        <div class="contact-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div>
                            <p class="contact-label">Email</p>
                            <p class="contact-value">hoangthelong.work@gmail.com</p>
                        </div>
                    </div>
                    <div class="contact-card">
                        <div class="contact-icon">
                            <i class="fa-solid fa-comment-dots"></i>
                        </div>
                        <div>
                            <p class="contact-label">Zalo</p>
                            <p class="contact-value">0358 500 914</p>
                        </div>
                    </div>
                    <div class="contact-card">
                        <div class="contact-icon">
                            <i class="fa-brands fa-facebook-f"></i>
                        </div>
                        <div>
                            <p class="contact-label">Facebook</p>
                            <p class="contact-value"><a href="https://facebook.com" target="_blank" rel="noopener">Hoàng Thế Long</a></p>
                        </div>
                    </div>
                    <div class="contact-card">
                        <div class="contact-icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div>
                            <p class="contact-label">Địa chỉ</p>
                            <p class="contact-value">Hà Nội, Việt Nam</p>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="contact-form-wrapper animate-on-scroll">
                    <h3 class="contact-form-title">
                        <i class="fa-solid fa-paper-plane"></i> Gửi tin nhắn
                    </h3>
                    <form action="https://formsubmit.co/hoangthelong.work@gmail.com" method="POST" class="contact-form">
                        <input type="hidden" name="_subject" value="Tin nhắn mới từ CV Website">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="">

                        <div class="form-group">
                            <label class="form-label" for="name">Họ tên</label>
                            <input class="form-input" type="text" id="name" name="name" required placeholder="Nhập họ và tên">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-input" type="email" id="email" name="email" required placeholder="Nhập email của bạn">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="subject">Tiêu đề</label>
                            <input class="form-input" type="text" id="subject" name="subject" required placeholder="Tiêu đề tin nhắn">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="message">Nội dung</label>
                            <textarea class="form-textarea" id="message" name="message" required placeholder="Nhập nội dung tin nhắn..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-submit">
                            <i class="fa-solid fa-paper-plane"></i> Gửi tin nhắn
                        </button>
                    </form>
                </div>
            </div>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© 2026 Hoàng Thế Long. All rights reserved.</p>
            <div class="footer-social">
                <a href="https://facebook.com" target="_blank" rel="noopener"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://zalo.me/0358500914" target="_blank" rel="noopener"><i class="fa-solid fa-comment-dots"></i></a>
            </div>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/animations.js" defer></script>
</body>
</html>
